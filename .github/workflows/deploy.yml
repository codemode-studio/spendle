name: Deploy
# Publishes `main` to Cloudflare once Verify passes on it; a manual run
# redeploys the latest `main`.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; a newer commit waits instead of cancelling
# an upload halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SPENDLE_ORIGIN }}
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit Verify passed, not whatever `main` points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Re-running an older Verify must not roll production back: deploy only
      # while this commit is still the tip of `main`.
      - name: Check main
        id: main
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$(git rev-parse --short HEAD) is no longer the tip of main; not deploying it"
          fi
      - if: steps.main.outputs.current == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      # The production origin is a repository variable, so a fork deploys to
      # its own domain.
      - name: Build
        if: steps.main.outputs.current == 'true'
        run: vp run build
        env:
          SPENDLE_ORIGIN: ${{ vars.SPENDLE_ORIGIN }}
      # Worker secrets live in Cloudflare and carry over to each new version.
      - name: Deploy
        if: steps.main.outputs.current == 'true'
        run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
