name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          # The self-hosted runner keeps its pnpm store between runs; an
          # Actions cache would upload and restore that whole store (GBs).
          cache: false
          run-install: true
      - name: Setup check
        run: vp run setup:check
      # Same steps as `vp run verify`, split so a failure names its check.
      - name: Check (format and lint)
        run: vp check
      - name: Typecheck
        run: vp run -r --parallel typecheck
      - name: Test
        run: vp run -r --parallel test
      - name: Build
        run: vp run build
