name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: vp run setup:check
      - run: vp run verify
